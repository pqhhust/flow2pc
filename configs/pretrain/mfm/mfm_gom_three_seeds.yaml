# MFM GoM sigma_005 selected run; launcher replaces seed, data root and output.
data:
  name: mfm_snapshots
  params:
    profile: gom
  root: data/gom/seed42
model:
  name: mfm
  params:
    backend: snapshots
    native:
      hidden_dims_geopath:
      - 64
      - 64
      - 64
      hidden_dims_flow:
      - 64
      - 64
      - 64
      activation_geopath: selu
      activation_flow: selu
      time_geopath: true
      sigma: 0.05
      optimal_transport_method: exact
      velocity_metric: land
      gamma_current: 0.125
      rho: 0.001
      alpha_metric: 2
      n_centers: 100
      kappa: 1.0
      metric_epochs: 50
      metric_patience: 5
      metric_lr: 0.01
      geopath_optimizer: adam
      geopath_lr: 0.0001
      geopath_weight_decay: 1.0e-05
      flow_optimizer: adamw
      flow_lr: 0.001
      flow_weight_decay: 1.0e-05
output:
  dir: outputs/pretrain/mfm/gom/three-seeds
seed: 42
stage: pretrain
training:
  epochs: 1000
  batch_size: 128
  device: cuda:0
  patience_geopath: 5
  patience_flow: 5
  validate_every: 1
wandb:
  group: gom-mfm
  mode: online
  project: flow2pc
