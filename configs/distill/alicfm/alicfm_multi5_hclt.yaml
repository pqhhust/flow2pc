# Selected historical student hyperparameters; current shared velocity-MSE trainer.
# Applied to the newly pretrained teacher; this is not an exact historical sweep replay.
stage: distill
seed: 0
teacher:
  checkpoint: /data/lthung/flow2pc/pretrained-teachers/alicfm/multi5/checkpoints/last.pt
  name: alicfm
student:
  name: hclt
  params:
    num_latents: 256
    time_embedding_dim: 64
    time_feature_seed: 0
distillation:
  sampler:
    name: teacher_interpolant
    params: {}
  device: cuda:0
  steps: 50000
  batch_size: 64
  lr: 0.001
  validate_every: 1000
  checkpoint_every: 1000
  log_every: 100
  validation_batches: 4
  validation_batch_size: 128
  resume: true
  validation_scope: observed_rows
logging:
  mode: online
  project: flow2pc
  name: multi5-alicfm-hclt-h256-f64-lr0.001-b64-n50000-s0
output:
  dir: /data/lthung/flow2pc/distill/alicfm/selected-students/multi5/multi5-alicfm-hclt-h256-f64-lr0.001-b64-n50000-s0
evaluation:
  enabled: true
  num_samples: 2048
  metric_samples: 2048
  batch_size: 64
  seed: 2026
  solver: dopri5
  tolerance: 1.0e-05
  ode_steps: 100
  max_nfe: 50000
  metric_space: historical
  source_split: all
  reference_split: all
