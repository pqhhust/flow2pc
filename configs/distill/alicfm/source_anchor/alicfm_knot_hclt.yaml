# Source-NLL pilot: selected teacher/architecture/LR/steps/query policy retained.
# Full state dimension; no PCA refit or projection. Best.pt uses validation velocity MSE.
# Intermediate population diagnostics disabled; final evaluation/images retained.
# Student-only independent 1024-point knot marginals; frozen teacher/benchmark data unchanged.
stage: distill
seed: 0
teacher:
  checkpoint: /data/lthung/flow2pc/pretrained-teachers/alicfm/knot/checkpoints/last.pt
  format: framework
  name: alicfm
student:
  name: hclt
  params:
    num_latents: 128
    time_embedding_dim: 128
    time_feature_seed: 0
distillation:
  sampler:
    name: teacher_interpolant
    params: {}
  device: cuda:0
  steps: 20000
  batch_size: 64
  lr: 0.003
  validate_every: 1000
  checkpoint_every: 1000
  log_every: 100
  validation_batches: 4
  validation_batch_size: 128
  resume: true
  source_nll_weight: 0.01
  validation_population_metrics: false
  student_data:
    name: independent_knot
    samples_per_time: 1024
    seed: 20261126
logging:
  mode: online
  project: flow2pc
  name: knot-alicfm-hclt-source-nll0.01
output:
  dir: /data/lthung/flow2pc/distill/source-nll-manual-v2/alicfm/knot
evaluation:
  enabled: true
  num_samples: 0
  metric_samples: 512
  seed: 2026
  batch_size: 64
  tolerance: 1.0e-05
  max_nfe: 50000
  solver: rk4
  ode_steps: 100
  metric_space: historical
  source_split: all
  reference_split: all
