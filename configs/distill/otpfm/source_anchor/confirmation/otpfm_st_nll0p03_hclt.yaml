# Confirmation recipe chosen from the validation velocity/source-NLL tradeoff.
# Pins the completed seed-0 run; use run_source_nll_confirmation_7gpu.sh for seeds 1/2.
stage: distill
seed: 0
teacher:
  name: otpfm
  checkpoint: /data/lthung/flow2pc/pretrained-teachers/otpfm/st/checkpoints/last.pt
  format: framework
student:
  name: hclt
  params:
    num_latents: 256
    time_embedding_dim: 32
    time_feature_seed: 0
distillation:
  sampler:
    name: otpfm_conditional
    params: {}
  device: cuda:0
  steps: 20000
  batch_size: 64
  lr: 0.002
